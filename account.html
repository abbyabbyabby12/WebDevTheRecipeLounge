   <header>

</header>

    <!-- menu sandwich icon button: ☰ -->
   <label for="menu-toggle" class="menu-btn"> ☰ MENU </label>

   <!-- Hidden checkbox for controls menu-->

    <!-- curtain menu-->

    <!-- close icon button x-->

        <div class="menu-items">
             <a href="index.html">HOME</a>
              <a href="browseRecipes.html">BROWSE RECIPES</a>

             <a href="contactUs.html">CONTACT US</a>
      
        </div>

     </div>
      
</nav>


<main>

    <h2>My Account</h2>

    <section class="account-section" aria-labelledby="profile-heading">

        <!-- My Profile heading + account actions -->
        <div class="account-header">
            <h3 id="profile-heading">My Profile</h3>
            <div class="account-actions">
                <button type="button" id="logout-btn" class="btn btn-secondary">Log Out</button>
                <button type="button" id="switch-btn" class="btn btn-secondary">Switch Account</button>
            </div>
        </div>

        <!-- Profile details card -->
        <form id="profile-form" class="profile-card" aria-labelledby="details-heading">

            <div class="profile-top">
                <!-- Profile icon (placeholder avatar) -->
                <svg class="avatar" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Profile picture placeholder">
                    <circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="32" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 52c4-10 12-14 20-14s16 4 20 14" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <h4 id="details-heading">Profile Details</h4>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="firstName" autocomplete="given-name" readonly>
                </div>

                <div class="form-field">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="lastName" autocomplete="family-name" readonly>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" readonly>
                </div>

                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" readonly>
                </div>

                <div class="form-field">
                    <label for="mobile">Mobile number</label>
                    <input type="tel" id="mobile" name="mobile" autocomplete="tel" readonly>
                </div>

                <div class="form-field form-field-button">
                    <button type="button" id="change-password-btn" class="btn btn-secondary">Change Password</button>
                </div>
            </div>

            <button type="button" id="edit-profile-btn" class="btn btn-primary">
                ✎ Edit Profile Details
            </button>

        </form>

    </section>

</main>
