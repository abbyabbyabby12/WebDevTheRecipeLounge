<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Recipes page</title>
    <link rel="stylesheet" type="text/css" href="styles.css"> 
</head>





<body>
   
<header>
    <h1> The Recipe Lounge</h1>
</header>

<nav>
    <!-- menu sandwich icon button: ☰ -->
   <label for="menu-toggle" class="menu-btn"> ☰ MENU </label>

   <!-- Hidden checkbox for controls menu-->
    <input type="checkbox" id="menu-toggle">

    <!-- curtain menu-->
     <div class="menu">
    <!-- close icon button x-->
        <label for="menu-toggle" class="close-btn">&times;</label>
        <div class="menu-items">
             <a href="index.html">HOME</a>
              <a href="browseRecipes.html">BROWSE RECIPES</a>
             <a href="favourites.html">FAVOURITES</a>
             <a href="account.html">MY ACCOUNT</a>
             <a href="aboutUs.html">ABOUT US</a>
             <a href="contactUs.html">CONTACT US</a>
      
        </div>

     </div>
      
</nav>



<main>

    <h2>Browse Recipes</h2>
    <p>Discover your next favourite drink!</p>

    <!-- Search bar -->
    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search drinks, flavours or ingredients..."
            aria-label="Search drinks"
        >

    </section>

    <!-- Recipe filters -->
    <section class="filters">

        <!-- Drink category filter -->
        <label for="categoryFilter">Drink Category:</label>

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="wine-mixes">Wine Mixes</option>
            <option value="smoothies">Smoothies</option>
            <option value="milkshakes">Milkshakes</option>
            <option value="mocktails">Mocktails</option>
            <option value="cocktails">Cocktails</option>
            <option value="hot-drinks">Hot Drinks</option>
            <option value="slushies">Frozen Slushies</option>
            <option value="soft-drinks">Soft Drinks & Sodas</option>
            <option value="lemonades">Lemonades</option>
            <option value="iced-teas">Iced Teas</option>
            <option value="coffee">Coffee</option>
            <option value="tropical-drinks">Tropical Drinks</option>
        </select>

        <!-- Difficulty filter -->
        <label for="difficultyFilter">Difficulty:</label>

        <select id="difficultyFilter">
            <option value="all">All Levels</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <!-- Reset filters -->
        <button type="button" id="resetFilters">
            Clear Filters
        </button>

    </section>


    <!-- Recipe cards will be displayed here using JavaScript -->
   <section class="recipe-results">

    <p id="recipeCount"></p>

    <div id="recipeContainer" class="recipe-container">

        <!-- Recipe images and names appear here -->

    </div>


    <!-- Message displayed when no recipes match -->
    <p id="noResults" hidden>
        No drinks found. Try another search or change your filters!
    </p>


    </section>
</main>

<!-- load the recipe data first, then browse page functionality -->
<script src="browseRecipes.js" defer></script>

<footer>
    <p>Created by Abigail Chapman &copy; 2026</p>

    <div class="footer-links">
        <a href="aboutUs.html">About Us</a>
        <a href="contactUs.html">Contact Us</a>
    </div>
</footer>



</body>

</html>
